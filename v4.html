<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PILOT TIMER v2</title>
<style>
  :root {
    --bg: #080c10; --bg2: #0d1318; --bg3: #111820;
    --cyan: #00d4ff; --green: #00ff9d; --orange: #ff6b35;
    --dc: rgba(0,212,255,0.12); --dg: rgba(0,255,157,0.10);
    --border: rgba(0,212,255,0.35); --font: 'Courier New', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--cyan); font-family: var(--font); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 40px; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px); pointer-events: none; z-index: 100; }
  body::after { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  .wrap { position: relative; z-index: 1; width: 100%; max-width: 460px; padding: 0 16px; }
  .hdr { text-align: center; padding: 28px 0 20px; }
  .hdr-lbl { font-size: 10px; letter-spacing: 6px; color: rgba(0,212,255,0.7); text-transform: uppercase; margin-bottom: 6px; }
  .hdr-title { font-size: 26px; font-weight: bold; letter-spacing: 8px; color: var(--cyan); text-shadow: 0 0 20px rgba(0,212,255,0.8); text-transform: uppercase; }
  .hdr-sub { font-size: 9px; letter-spacing: 4px; color: rgba(0,212,255,0.6); margin-top: 4px; }
  .hdr-v2 { font-size: 10px; letter-spacing: 4px; color: var(--orange); margin-top: 6px; text-transform: uppercase; }
  .div { height: 1px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: 0.4; margin: 4px 0 24px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 18px; margin-bottom: 12px; position: relative; overflow: hidden; }
  .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--cyan), transparent); opacity: 0.6; }
  .clbl { font-size: 10px; letter-spacing: 4px; color: rgba(0,212,255,0.8); text-transform: uppercase; margin-bottom: 10px; }
  input[type=text], input[type=number] { width: 100%; background: var(--bg3); border: 1px solid rgba(0,212,255,0.4); border-radius: 3px; color: var(--cyan); font-family: var(--font); font-size: 24px; letter-spacing: 4px; padding: 10px 12px; outline: none; -webkit-appearance: none; transition: border-color .2s, box-shadow .2s; }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,212,255,0.3); }
  input::placeholder { color: rgba(0,212,255,0.4); }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .irow { display: flex; align-items: center; gap: 10px; }
  .iunit { font-size: 11px; color: rgba(0,212,255,0.7); letter-spacing: 2px; white-space: nowrap; }
  .prev { margin-top: 12px; padding: 10px 12px; background: var(--dg); border: 1px solid rgba(0,255,157,0.35); border-radius: 3px; display: flex; align-items: center; justify-content: space-between; gap: 8px; opacity: 0; transform: translateY(4px); transition: opacity .25s, transform .25s; }
  .prev.on { opacity: 1; transform: translateY(0); }
  .prev-lbl { font-size: 12px; color: var(--green); letter-spacing: 1px; }
  .prev-t { font-size: 20px; color: var(--green); letter-spacing: 3px; text-shadow: 0 0 10px rgba(0,255,157,0.5); }
  .wbtn { background: transparent; border: 1px solid rgba(0,255,157,0.5); border-radius: 3px; color: var(--green); font-family: var(--font); font-size: 10px; letter-spacing: 2px; padding: 8px 10px; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
  .wbtn:active { background: rgba(0,255,157,0.15); }
  .mrow { display: flex; gap: 10px; }
  .mbtn { flex: 1; background: var(--bg3); border: 1px solid rgba(0,212,255,0.3); border-radius: 3px; color: rgba(0,212,255,0.7); font-family: var(--font); font-size: 11px; letter-spacing: 2px; padding: 10px 6px; cursor: pointer; text-transform: uppercase; text-align: center; line-height: 1.5; transition: all .15s; }
  .mbtn.on { border-color: var(--cyan); color: var(--cyan); background: var(--dc); box-shadow: 0 0 8px rgba(0,212,255,0.2); }
  .tbtn { flex: 1; background: var(--bg3); border: 1px solid rgba(0,255,157,0.3); border-radius: 3px; color: rgba(0,255,157,0.7); font-family: var(--font); font-size: 11px; letter-spacing: 2px; padding: 10px 6px; cursor: pointer; text-transform: uppercase; text-align: center; line-height: 1.5; transition: all .15s; }
  .tbtn.on { border-color: var(--green); color: var(--green); background: var(--dg); box-shadow: 0 0 8px rgba(0,255,157,0.2); }
  .cbtn { width: 100%; background: transparent; border: 1px solid var(--cyan); border-radius: 3px; color: var(--cyan); font-family: var(--font); font-size: 13px; letter-spacing: 4px; padding: 13px; cursor: pointer; text-transform: uppercase; transition: background .15s; text-shadow: 0 0 8px rgba(0,212,255,0.5); }
  .cbtn:active { background: var(--dc); }
  .errmsg { font-size: 10px; letter-spacing: 2px; color: var(--orange); text-align: center; margin: -4px 0 8px; min-height: 13px; }
  .ocard { background: var(--bg2); border: 1px solid rgba(0,255,157,0.35); border-radius: 4px; padding: 18px; margin-bottom: 12px; display: none; animation: fi .3s ease; position: relative; overflow: hidden; }
  .ocard::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--green), transparent); opacity: 0.6; }
  .ocard.on { display: block; }
  @keyframes fi { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .olbl { font-size: 10px; letter-spacing: 4px; color: rgba(0,255,157,0.7); text-transform: uppercase; margin-bottom: 14px; }
  .orow { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(0,212,255,0.08); }
  .orow:last-of-type { border-bottom: none; }
  .otxt { font-size: 13px; color: var(--green); letter-spacing: 1px; }
  .otxt.p { color: var(--orange); }
  .otime { font-size: 22px; letter-spacing: 3px; color: var(--green); text-shadow: 0 0 8px rgba(0,255,157,0.4); }
  .otime.p { color: var(--orange); text-shadow: 0 0 8px rgba(255,107,53,0.4); }
  .cpbtn { width: 100%; background: transparent; border: 1px solid rgba(0,255,157,0.5); border-radius: 3px; color: var(--green); font-family: var(--font); font-size: 12px; letter-spacing: 3px; padding: 11px; cursor: pointer; text-transform: uppercase; margin-top: 12px; }
  .cpbtn:active { background: rgba(0,255,157,0.08); }
  .cpok { font-size: 10px; letter-spacing: 3px; color: var(--green); text-align: center; margin-top: 7px; height: 13px; opacity: 0; transition: opacity .2s; }
  .cpok.on { opacity: 1; }
  .ft { font-size: 9px; letter-spacing: 3px; color: rgba(0,212,255,0.3); text-align: center; margin-top: 8px; }
  .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 5px var(--orange); animation: bk 2s infinite; vertical-align: middle; margin-right: 4px; }
  @keyframes bk { 0%,49%{opacity:1} 50%,100%{opacity:.2} }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-lbl"><span class="dot"></span>flight operations</div>
    <div class="hdr-title">PILOT TIMER</div>
    <div class="hdr-sub">PRE-FLIGHT SCHEDULE CALCULATOR</div>
    <div class="hdr-v2">✈ DROP-OFF · v2</div>
  </div>
  <div class="div"></div>

  <div class="card">
    <div class="clbl">// tipo de vuelo</div>
    <div class="mrow">
